project:
  type: website

filters:
  - etale.lua

website:
  title: "p-adic geometry notes"
  site-url: "https://hechetory.github.io/p-adic_geometry_note/"
  description: "Intuition-first notes on p-adic and algebraic geometry."
  page-navigation: true
  reader-mode: true
  search:
    location: sidebar
    type: overlay
  repo-url: "https://github.com/Hechetory/p-adic_geometry_note"
  repo-actions: [edit, source, issue]
  navbar:
    background: primary
    right:
      - icon: github
        href: "https://github.com/Hechetory/p-adic_geometry_note"
        aria-label: GitHub
  sidebar:
    style: docked
    collapse-level: 2
    contents:
      - href: index.qmd
        text: Home
      - section: "Étale Morphisms"
        contents:
          - href: "etale morphism/index.qmd"
            text: Overview
          - href: "etale morphism/definitions.qmd"
            text: Definitions
          - href: "etale morphism/unramified-morphisms.qmd"
            text: The Sheaf of Differentials and Unramified Morphisms
          - href: "etale morphism/smooth-morphisms.qmd"
            text: Smooth Morphisms
          - href: "etale morphism/flat-morphisms.qmd"
            text: Flat Morphisms
          - href: "etale morphism/smooth-morphisms-again.qmd"
            text: Smooth Morphisms Again
          - href: "etale morphism/etale-morphisms.qmd"
            text: Étale Morphisms
      - section: "The Jacquet–Langlands Correspondence"
        contents:
          - href: "jacquet-langlands correspondence/index.qmd"
            text: Overview
          - href: "jacquet-langlands correspondence/haar-local-fields.qmd"
            text: Haar Measure and Local Fields
      - href: editing.qmd
        text: How to edit these notes
  page-footer:
    left: "An evolving notebook on p-adic geometry."
    right: "Built with Quarto and GitHub Pages."

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    link-external-newwindow: true

execute:
  freeze: auto
